<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Gaja</title>
  <desc id="d">Animated banner: a glowing orb wakes on "Hej Gaja", listens, thinks and speaks while a voice waveform moves. Gaja, a Polish-first real-time voice assistant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1410"/><stop offset="1" stop-color="#0d0906"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#fff3cf"/><stop offset="0.32" stop-color="#f7c66f"/>
      <stop offset="0.72" stop-color="#df7d52"/><stop offset="1" stop-color="#8c3f2b"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.38"/><stop offset="0.6" stop-color="#e07f55" stop-opacity="0.10"/><stop offset="1" stop-color="#e07f55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd3d8" stop-opacity="0.30"/><stop offset="1" stop-color="#6fd3d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3cf"/><stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .orbg { transform-box: fill-box; transform-origin: center; }
    .halo { animation: halo 12s ease-in-out infinite; }
    .halot { opacity: 0; animation: halot 12s ease-in-out infinite; }
    .orbbody { animation: orb 12s ease-in-out infinite; }
    .ring { opacity: 0; fill: none; stroke: #f4b860; stroke-width: 2; }
    .r1 { animation: ripple 12s ease-out infinite; }
    .r2 { animation: ripple 12s ease-out infinite; animation-delay: 0.35s; }
    .lring { fill: none; stroke: #6fd3d8; stroke-width: 2; stroke-dasharray: 3 9; stroke-linecap: round; opacity: 0; animation: lring 12s linear infinite; }
    .b { fill: inherit; transform-box: fill-box; transform-origin: center; animation: bar 1s ease-in-out infinite alternate; }
    .wave { fill: #f4b860; transform-box: view-box; animation: wave 12s ease-in-out infinite, wavecolor 12s linear infinite; }
    .pill { fill: #2a2018; stroke: #4a3a2a; stroke-width: 1; animation: pill 12s ease-in-out infinite; }
    .pilltxt { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #8d7a65; animation: pilltxt 12s ease-in-out infinite; }
    .cap { font-size: 22px; opacity: 0; animation: cap 12s ease-in-out infinite; }
    .c0 { fill: #f4b860; opacity: 0; }
    .c1 { fill: #6fd3d8; }
    .c2 { fill: #a8977f; }
    .c3 { fill: #f4b860; opacity: 1; }
    .c1, .c2 { opacity: 0; }
    .dot { animation: dot 1.2s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes halot { 0%,24% { opacity: 0; } 30%,48% { opacity: 1; } 54%,100% { opacity: 0; } }
    @keyframes orb {
      0% { transform: scale(1); } 12% { transform: scale(1.03); } 22% { transform: scale(1.0); }
      27% { transform: scale(1.12); } 33% { transform: scale(1.0); }
      42% { transform: scale(1.04); } 50% { transform: scale(1.0); }
      58% { transform: scale(0.95); } 66% { transform: scale(1.0); } 74% { transform: scale(0.97); }
      80% { transform: scale(1.1); } 86% { transform: scale(1.02); } 92% { transform: scale(1.09); } 100% { transform: scale(1); }
    }
    @keyframes ripple { 0%,17% { opacity: 0; transform: scale(1); } 18% { opacity: .85; transform: scale(1); } 30% { opacity: 0; transform: scale(2.1); } 100% { opacity: 0; transform: scale(2.1); } }
    @keyframes lring { 0%,24% { opacity: 0; transform: rotate(0); } 28%,48% { opacity: .9; } 52%,100% { opacity: 0; transform: rotate(180deg); } }
    @keyframes bar { from { transform: scaleY(.28); } to { transform: scaleY(1); } }
    @keyframes wave {
      0%,22% { transform: scaleY(.07); opacity: .55; } 28%,47% { transform: scaleY(.85); opacity: 1; }
      53%,72% { transform: scaleY(.07); opacity: .55; } 78%,97% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(.07); opacity: .55; }
    }
    @keyframes wavecolor { 0%,24% { fill: #f4b860; } 26%,48% { fill: #6fd3d8; } 51%,72% { fill: #8d7a65; } 76%,100% { fill: #f4b860; } }
    @keyframes pill { 0% { fill: #4a3418; stroke: #f4b860; } 22% { fill: #4a3418; stroke: #f4b860; } 25%,100% { fill: #2a2018; stroke: #4a3a2a; } }
    @keyframes pilltxt { 0%,22% { fill: #ffe2a8; } 25%,100% { fill: #8d7a65; } }
    @keyframes cap { 0% { opacity: 0; transform: translateY(6px); } 4%,21% { opacity: 1; transform: translateY(0); } 24%,100% { opacity: 0; transform: translateY(-4px); } }
    @keyframes dot { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .wave { transform: scaleY(.8); }
      .b { transform: scaleY(.7); }
      .c0, .c1, .c2 { opacity: 0; }
    }
  </style>

