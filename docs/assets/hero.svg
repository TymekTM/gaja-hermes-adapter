    <!-- title -->
    <text x="436" y="148" font-size="88" font-weight="800" fill="url(#title)" letter-spacing="-2">Gaja</text>
    <text x="440" y="186" font-size="24" font-weight="600" fill="#f2e7d6">Polish-first, real-time voice assistant</text>
    <text x="440" y="214" font-size="16" fill="#a8977f">Local speech recognition · local LLM · expressive TTS · Hermes agent hand-off</text>

    <!-- captions -->
    <g transform="translate(440,252)">
      <text class="cap c0" style="animation-delay:0s">“Hej Gaja…”</text>
      <text class="cap c1" style="animation-delay:-9s">“Hej Gaja, która jest godzina?”</text>
      <text class="cap c2" style="animation-delay:-6s">thinking<tspan class="dot">.</tspan><tspan class="dot" style="animation-delay:.2s">.</tspan><tspan class="dot" style="animation-delay:.4s">.</tspan></text>
      <text class="cap c3" style="animation-delay:-3s">Gaja: “Jest dwudziesta pierwsza dziesięć.”</text>
    </g>

