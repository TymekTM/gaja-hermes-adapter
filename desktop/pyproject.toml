[project]
name = "gaja-desktop"
version = "0.1.0"
description = "Gaja desktop client: the Windows PC joins Gaja as a voice device and runs the agent's PC tools"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [{ name = "Gaja" }]
dependencies = [
    "websockets>=13",
    "numpy>=1.26",
    # Audio capture (mic / VB-CABLE / loopback) and playback. Imported lazily so headless
    # machines without audio libraries can still run everything else.
    "soundcard>=0.4.2",
    # Wake word ("Hej Gaja") on-device, same model as the ESP32 firmware.
    "pymicro-wakeword>=2.4",
    # Tray icon + settings window.
    "pystray>=0.19",
    "pillow>=10",
    # Screenshot and input tools.
    "mss>=9",
    "pynput>=1.7.6",
    "pyperclip>=1.9",
    # Config location and TOML writing (reading is stdlib tomllib on 3.11+).
    "platformdirs>=4",
    "tomli-w>=1",
]

[project.scripts]
gaja-desktop = "gaja_desktop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaja_desktop"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
