# =====================================================================================================
#  Gaja voice assistant firmware for the M5Stack Atom VoiceS3R / EchoS3R (ESP32-S3, ES8311, NS4150B).
#
#  Speaks the Gaja device protocol v1.11 (docs/DEVICE.md, docs/FULL_DUPLEX.md) over WebSocket:
#    "Hej Gaja" (on-device microWakeWord) -> wake + 1.5 s pre-roll + live 16 kHz PCM16 frames ->
#    server-side VAD/STT/LLM/TTS -> reply PCM16 @ 48 kHz from the speaker, volume adapted to how
#    loudly the user spoke. FULL DUPLEX: the microphone keeps running while the speaker plays and
#    the device streams the playback reference alongside the mic (tagged frames), so the server's
#    echo canceller lets the user interrupt Gaja mid-sentence by just talking (VAD barge-in) or
#    by saying "Hej Gaja" again.
#  v1.10 addition (caps.record): the server can record wake-word training takes ("Hej Gaja",
#  hard negatives, ambient) through the device mic; each on-device detection during a take is
#  reported as record_mark -- see firmware/README.md.
#
#  Every hardware setting below is copied verbatim from firmware/esphome/atom-voices3r-wakeword-test.yaml,
#  where it was VERIFIED ON THE DEVICE (ESPHome 2026.9.1). Do not "fix" them:
#    - ES8311 at 48000 Hz (at 16000 the ADC returns white noise), no use_microphone (analog MEMS mic),
#    - mic on the left I2S slot, speaker on the left slot at 48 kHz. In the verified 0.2.x firmware
#      mic and speaker shared ONE I2S bus half-duplex (mic stopped while the speaker played,
#      caps.aec = false); since the full-duplex rework (docs/FULL_DUPLEX.md) both directions run on
#      ONE ESP-IDF full-duplex controller at 48 kHz and the mic is decimated to 16 kHz on device,
#      so the mic no longer stops during playback,
#    - NS4150B amp enable GPIO18, ALWAYS_OFF (on -> 50 ms -> play -> drain + 100 ms -> off),
#    - media_player volume_max 0.75 = ES8311 DAC 0 dB = the firmware's volume 1.0,
#    - no VAD model in micro_wake_word (it vetoed real detections), stop_after_detection: true,
#    - mic gain: ES8311 24 dB + software gain_factor 4.
#
#  The gaja_device external component lives in components/gaja_device/ next to this file.
#  Secrets (firmware/esphome/secrets.yaml, gitignored): wifi_ssid, wifi_password, ap_password,
#  ota_password, gaja_server_url (ws://<server-ip>:8792/device), gaja_device_id, gaja_device_token.
# =====================================================================================================

substitutions:
  name: gaja-atom
  friendly_name: Gaja Atom

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # The on-device sounds' loudness reference (100% = ES8311 DAC at 0 dB).
      - media_player.volume_set:
          id: beeper
          volume: 100%
      # Power-on chime once the server link is up (so it also means "ready"); no chime when the
      # server is unreachable for a minute. is_connected() (not is_idle(), which is also true
      # while RECONNECTING) is what makes the chime mean "online"; wait_until does not block the
      # loop, so the client keeps connecting while this waits.
      - wait_until:
          condition:
            lambda: 'return id(gaja_dev).is_connected();'
          timeout: 60s
      - script.execute:
          id: play_sound
          boot: true

external_components:
  - source:
      type: local
      path: components
    components: [gaja_device]

esp32:
  board: esp32-s3-devkitc-1       # no dedicated board entry for the Atom S3R; ESP32-S3 with 8 MB flash
  flash_size: 8MB
  framework:
    type: esp-idf
    # NOTE: CONFIG_ESP_WS_CLIENT_SEPARATE_TX_LOCK is deliberately NOT set. With it, a failed write
    # on the caller's thread does xSemaphoreTakeRecursive(client->lock, portMAX_DELAY) while the
    # WS task can hold that lock through a stalled mid-frame receive for 15-20 s: the main loop
    # blocks forever and the 5 s task watchdog reboots the device mid-turn. Without it every send
    # takes client->lock with gaja_device's 100 ms timeout, so a stall shows up as "busy" sends
    # (SEND_BUSY_LIMIT -> reconnect). The cost: a send can be "busy" while the WS task sits in a
    # playback-ring backpressure wait (<= 200 ms) -- uplink and downlink never overlap on this
    # half-duplex device except for the tiny pong/control messages, which are retried or re-armed.

psram:
  mode: octal                      # N8R8 = 8 MB octal PSRAM (pre-roll + audio rings live there)
  speed: 80MHz

logger:
  level: DEBUG
  logs:
    wifi: INFO
    wifi_esp32: INFO
    component: INFO
    scheduler: INFO
    preferences: INFO
    web_server: INFO
    # Per-reply chatter off: every log line is also pushed to an open web UI / log stream (SSE),
    # and a busy stream measurably stalls the device's network during replies.
    speaker_media_player: INFO
    ring_buffer: INFO
    i2s_audio.speaker: INFO
    micro_wake_word: DEBUG         # logs each detection with its window-average and max probability
    # gaja_device per-frame logs are at VERBOSE: raise the global level to VERBOSE to see them

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none          # latency jitter hurts the 20 ms uplink stream more than mA
  # No periodic "is there a better mesh node?" scans: each one takes the radio off-channel for
  # seconds, and the Atom does not move. A lost link still picks the best node when it reconnects.
  post_connect_roaming: false
  # 2.4 GHz only. Fallback AP lets you recover from a wrong password.
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

web_server:
  id: web_ui
  port: 80                         # optional: http://<ip>/ for logs without USB
  log: false                       # no live log stream: gaja_device forwards the logs while idle

i2c:
  - id: bus_codec
    # GPIO0/GPIO45 are ESP32-S3 strapping pins; we use them anyway (board wiring is fixed) and silence
    # the ESPHome warning so the config passes validation.
    sda:
      number: GPIO45
      ignore_strapping_warning: true
    scl:
      number: GPIO0
      ignore_strapping_warning: true

# One full-duplex I2S controller owned by the gaja_device component (IDF full-duplex mode: TX and
# RX channels on the same port, shared clocks at the ES8311-verified 48000 Hz). The microphone
# keeps running while the speaker plays; the 48 kHz mic stream is decimated to 16 kHz on device.
# This replaces the old half-duplex `i2s_audio` + `microphone: platform: i2s_audio` +
# `speaker: platform: i2s_audio` stack (the mic and speaker there lock the shared bus and can
# never run together). gaja_device: duplex: true switches the client behaviour; set it to false
# (and restore the i2s_audio stack) to get the verified 0.2.x half-duplex behaviour back.
microphone:
  - platform: gaja_device
    id: mic_codec
    # The clock pins were VERIFIED ON THE DEVICE on the shared i2s_audio bus; they are kept
    # verbatim. GPIO3 is a strapping pin (JTAG select), fixed by the board wiring.
    i2s_lrclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO11
    i2s_din_pin: GPIO4            # the codec's ADC data is on the left slot; "right" reads zeros

speaker:
  - platform: gaja_device
    id: spk_codec
    microphone_id: mic_codec      # attaches to the same full-duplex bus (one I2S controller)
    i2s_dout_pin: GPIO48          # ES8311 DSDIN (verified in 0.2.x); without it the speaker is silent
    audio_dac: es8311_codec
    # Audio plays at 48000 Hz (fixed by the shared clock); the internal 500 ms queue replaces the
    # old buffer_duration/timeout options (the end-of-reply timing is gaja_device's job anyway).

audio_dac:
  - platform: es8311
    id: es8311_codec
    i2c_id: bus_codec
    address: 0x18
    sample_rate: 48000                # verified: at 16000 the codec clocks are wrong (white noise)
    bits_per_sample: 16bit
    use_mclk: true
    # No use_microphone: this board has an ANALOG MEMS mic; use_microphone selects the PDM input.
    mic_gain: 24DB                 # 0DB..42DB; 24 dB + gain_factor 4 may clip near speech (watch the
                                   # sound_level sensor and rebalance before touching probability_cutoff)

switch:
  - platform: gpio
    id: speaker_enable
    name: "Speaker amplifier"
    internal: true
    pin: GPIO18
    restore_mode: ALWAYS_OFF       # NS4150B enable; left on, the amp hisses audibly

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  # Mic level every 5 s in the log: use it to calibrate quiet_db/loud_db (it shows the same
  # gain_factor 4 audio the wake model and the uplink stream see).
  - platform: sound_level
    microphone:
      microphone: mic_codec
      channels: 0
      gain_factor: 4
    passive: true
    measurement_duration: 5s
    peak:
      name: "Mic peak"
    rms:
      name: "Mic RMS"

binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO41
      inverted: true
      mode: INPUT_PULLUP
    on_press:
      # Manual speaker test, independent of the server: beep like the verified wake-word-test
      # firmware did.
      - script.execute:
          id: play_sound
          boot: false

script:
  # One on-device sound through the media_player (manual beep or power-on chime). Only when the
  # device is idle: gaja_device must release the microphone and the wake word component so the
  # shared I2S bus is free for the speaker.
  - id: play_sound
    mode: single
    parameters:
      boot: bool
    then:
      - if:
          condition:
            lambda: 'return id(gaja_dev).is_idle();'
          then:
            - lambda: 'id(gaja_dev).begin_manual_playback();'
            - wait_until:
                condition:
                  lambda: 'return id(gaja_dev).duplex() || id(mic_codec).is_stopped();'
                timeout: 2s
            - switch.turn_on: speaker_enable
            - delay: 50ms          # let the amplifier settle so the sound's start is not cut
            - if:
                condition:
                  lambda: 'return boot;'
                then:
                  - media_player.speaker.play_on_device_media_file:
                      media_file: boot_chime_file
                      announcement: true
                else:
                  - media_player.speaker.play_on_device_media_file:
                      media_file: beep_file
                      announcement: true
            - delay: 100ms         # the announcement may not have started yet
            - wait_until:
                condition:
                  not:
                    media_player.is_announcing: beeper
                timeout: 20s       # a wedged media player must not leave the amp on and the mic off forever
            - delay: 100ms         # the I2S buffer drains after the announcement ends
            - switch.turn_off: speaker_enable
            - lambda: 'id(gaja_dev).end_manual_playback();'

# The announcement pipeline only plays the on-device sounds above (button beep, power-on chime);
# replies (and the wake beep) play straight through spk_codec with the volume set per turn by gaja_device.
media_player:
  - platform: speaker
    id: beeper
    name: None
    internal: true
    volume_min: 0.5                # 100% (set on boot) = 0.75 = ES8311 DAC at 0 dB, loudest clean
    volume_max: 0.75
    announcement_pipeline:
      speaker: spk_codec
      format: WAV
      sample_rate: 48000
      num_channels: 1
    files:
      - id: beep_file
        file: models/beep.wav
      - id: boot_chime_file
        file: models/boot_chime.wav    # make_boot_chime.py (gitignored like beep.wav)

micro_wake_word:
  id: mww_id
  microphone:
    microphone: mic_codec
    channels: 0
    gain_factor: 4                 # same software gain as the gaja_device stream (one consistent level)
  stop_after_detection: true       # frees the mic/inference for the streamed turn; gaja_device restarts it
  # No vad: block. On this mic's noise floor the stock VAD model vetoed real "Hej Gaja" detections;
  # the server-side Whisper verification filters false wakes.
  models:
    - model: models/hej_gaja.json   # trained manifest + .tflite, committed in models/
      id: hej_gaja
  on_wake_word_detected:
    then:
      # Hand the detection to the Gaja client (sends `wake`, the pre-roll burst, then live frames).
      - lambda: 'id(gaja_dev).on_wake(wake_word);'

gaja_device:
  id: gaja_dev
  server_url: !secret gaja_server_url        # e.g. ws://192.168.0.10:8792/device
  device_id: !secret gaja_device_id          # from scripts/device_token.py (the lead creates it)
  token: !secret gaja_device_token
  firmware_version: "gaja-esphome/0.3.6"    # 0.3.6: the uplink rides out a stalled server for 8 s instead of 3 s (first wake after an idle lost the turn), with socket diagnostics while blocked. 0.3.5: a silent half-duplex gap (bare wake, ack=none) is replayed into the follow-up window instead of dropped -- the user has no beep cue and starts the question before the window opens. 0.3.4: the wake beep plays to its end in full duplex (amp stays on over the DMA tail). 0.3.3: no mic stream through replies unless the server cancels echo (ready aec); no second beep after a bare wake. 0.3.2: uplink writes only when the socket has room (a write timeout aborted the link at every wake). 0.3.1: duplex speaker gets its DOUT pin (0.3.0 was silent). 0.3.0: full duplex — mic streams through playback, tagged frames with the playback reference, server-side AEC (0.2.5: wake beep opens follow-up windows, logs without ANSI)
  lang: pl
  duplex: true                    # full-duplex I2S: the mic keeps running while the speaker plays;
                                  # with duplex: false the firmware behaves exactly like the verified
                                  # 0.2.x half-duplex releases (restore the i2s_audio platforms then)
  microphone:
    microphone: mic_codec
    channels: 0
    gain_factor: 4                 # must match micro_wake_word's, so pre-roll and live audio match
  wake_word: mww_id                # id of the micro_wake_word block above
  speaker: spk_codec
  speaker_enable: speaker_enable
  out_rate: 48000                  # advertised in hello caps.out_rates and asserted on the speaker
                                   # before every playback (the i2s_audio speaker's stream info
                                   # defaults to 16 kHz; the sample_rate above does NOT set it)
  preroll_ms: 1500                 # pre-wake ring buffer in PSRAM (250..5000; protocol caps are
                                   # 0..5000, but this firmware streams live audio through the
                                   # same ring, so a floor of 250 ms is enforced)
  wake_score: 0.97                 # fixed score: the ESPHome trigger exposes no probability; the
                                   # model's own cutoff is 0.96 and the server only uses the score
                                   # for barge-in admission (impossible on this half-duplex device)
  # Adaptive reply volume: p90 of 20 ms frame RMS (dBFS) over the frames above a noise gate
  # (window floor + 6 dB; silence between words and the zero-padded flush do not count), mapped
  # linearly [quiet_db, loud_db] -> [vol_min, vol_max], clamped. Volume 1.0 = the beep at 100%
  # (ES8311 DAC 0 dB); 0.5 was verified INAUDIBLE on the device (the DAC volume is ~linear in dB),
  # so both ends are clamped to <= 1.0. CALIBRATE ON THE DEVICE using the Mic RMS sensor and the
  # INFO log line "speech level ... -> reply volume ...".
  quiet_db: -24.0                  # speech at the noise floor + ~4 dB (post-gain noise is ~-28 dBFS)
  loud_db: -12.0                   # normal speech at ~1 m measures ~-14 dBFS post-gain
  vol_min: 0.88                    # ~-11 dB below full scale: quiet, clearly audible
  vol_max: 1.0
  reply_gap_ms: 1500               # keep the reply "open" this long for another sentence
  log_web_server: web_ui           # web UI logs: buffered while busy, sent ~1 s after it goes idle
