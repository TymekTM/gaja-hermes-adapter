[project]
name = "gaja-hermes-adapter"
version = "0.1.0"
description = "Realtime voice-conversation adapter (STT -> local LLM -> TTS) with Hermes hand-off"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    # uv.lock does not record the cu126 wheel's CUDA runtime deps, so pin them explicitly.
    "nvidia-cublas-cu12==12.6.4.1",
    "nvidia-cuda-cupti-cu12==12.6.80",
    "nvidia-cuda-nvrtc-cu12==12.6.77",
    "nvidia-cuda-runtime-cu12==12.6.77",
    "nvidia-cudnn-cu12==9.5.1.17",
    "nvidia-cufft-cu12==11.3.0.4",
    "nvidia-curand-cu12==10.3.7.77",
    "nvidia-cusolver-cu12==11.7.1.2",
    "nvidia-cusparse-cu12==12.5.4.2",
    "nvidia-cusparselt-cu12==0.6.3",
    "nvidia-nccl-cu12==2.21.5",
    "nvidia-nvjitlink-cu12==12.6.85",
    "nvidia-nvtx-cu12==12.6.77",
    # resemble-perth imports pkg_resources, which setuptools 81+ no longer provides.
    "setuptools<81",
    "chatterbox-tts==0.1.7",
    "cactus-needle==3.1.2",
    "paradee @ git+https://github.com/sahilmahendrakar/paradee",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "soundfile>=0.12",
    "numpy<2",
    "piper-tts>=1.8.0",
    "jiwer>=4.0.0",
    "num2words>=0.5.14",
    "pyarrow>=25.0.1",
    "faster-whisper>=1.2.1",
    "silero-vad>=6.2.3",
    "websockets>=17.2",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "onnxruntime>=1.30.0",
    "supertonic>=1.3.1",
    "tomlkit>=0.13.3",
    "mcp>=1.26,<2",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running llama-server on 8791 and/or the real Hermes ACP worker"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
